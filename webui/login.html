<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理控制面板 · 登录</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <style>
        :root {
            --bg-base: #0f1117;
            --card-bg: rgba(22, 27, 34, 0.85);
            --border-color: rgba(255, 255, 255, 0.12);
            --border-focus: #58a6ff;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent: #238636;
            --accent-hover: #2ea043;
            --danger: #f85149;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 50% 30%, rgba(56, 139, 253, 0.08) 0%, transparent 70%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-primary);
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 36px 32px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .login-head {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-logo {
            font-size: 32px;
            margin-bottom: 8px;
            display: inline-block;
            filter: drop-shadow(0 2px 8px rgba(88, 166, 255, 0.4));
        }
        .login-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.02em;
        }
        .login-sub {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .field-group {
            margin-bottom: 18px;
        }
        .field-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .field-group input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(13, 17, 23, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .field-group input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2);
        }
        .login-btn {
            width: 100%;
            padding: 11px;
            background: var(--accent);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 8px;
        }
        .login-btn:hover {
            background: var(--accent-hover);
        }
        .login-btn:active {
            transform: scale(0.99);
        }
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error-hint {
            margin-top: 14px;
            font-size: 0.85rem;
            color: var(--danger);
            text-align: center;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-head">
            <div class="login-logo">♾️</div>
            <div class="login-title">管理控制面板</div>
            <div class="login-sub">请验证管理员身份以访问系统控制台</div>
        </div>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="field-group">
                <label for="adminUser">管理员账号</label>
                <input type="text" id="adminUser" name="username" autocomplete="username" required autofocus placeholder="admin">
            </div>
            <div class="field-group">
                <label for="adminPass">密码</label>
                <input type="password" id="adminPass" name="password" autocomplete="current-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="login-btn" id="btnLogin">登 录</button>
            <div class="error-hint" id="errorHint"></div>
        </form>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById("btnLogin");
            const hint = document.getElementById("errorHint");
            const user = document.getElementById("adminUser").value.trim();
            const pass = document.getElementById("adminPass").value;

            if (!user || !pass) {
                hint.textContent = "请输入账号和密码";
                return;
            }

            btn.disabled = true;
            btn.textContent = "正在验证...";
            hint.textContent = "";

            try {
                const res = await fetch("/admin/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const data = await res.json();
                if (res.ok && data.ok) {
                    if (data.token) {
                        localStorage.setItem("admin_token", data.token);
                    }
                    window.location.href = "/";
                } else {
                    hint.textContent = data.message || data.error || "账号或密码错误";
                    btn.disabled = false;
                    btn.textContent = "登 录";
                }
            } catch (err) {
                hint.textContent = "网络连接失败，请稍后重试";
                btn.disabled = false;
                btn.textContent = "登 录";
            }
        }
    </script>
</body>
</html>
